name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tests/validate.py
      - name: Build install archives
        run: |
          mkdir -p dist/skill/combover
          cp -R skills/combover/. dist/skill/combover/
          (cd dist/skill && zip -qr ../combover-skill.zip combover)
          git archive --format=zip --prefix=combover/ -o dist/combover-plugin.zip HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/combover-skill.zip dist/combover-plugin.zip --generate-notes
